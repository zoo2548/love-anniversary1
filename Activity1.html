<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💖 Our Anniversary - iPad Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #fff5f7 0%, #ffd1dc 100%);
      --glass: rgba(255, 255, 255, 0.45);
      --accent-pink: #ff5e99;
      --soft-shadow: 0 20px 50px rgba(255, 143, 179, 0.15);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-gradient);
      font-family: 'Kanit', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden; /* กัน Scroll สำหรับหน้า Dashboard บน iPad */
    }

    .ipad-frame {
      width: 90vw;
      max-width: 1100px;
      height: 85vh;
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 40px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      box-shadow: var(--soft-shadow);
      position: relative;
      z-index: 10;
    }

    /* --- Timer Section --- */
    .hero-section {
      text-align: center;
      margin-bottom: 40px;
    }

    .main-title {
      font-family: 'Caveat', cursive;
      font-size: 3.5rem;
      color: var(--accent-pink);
      margin: 0;
      filter: drop-shadow(2px 2px 2px white);
    }

    .timer-board {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    .time-card {
      background: white;
      padding: 15px 25px;
      border-radius: 20px;
      min-width: 100px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.03);
    }

    .time-card .val {
      display: block;
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--accent-pink);
    }

    .time-card .lbl {
      font-size: 0.9rem;
      color: #aaa;
      text-transform: uppercase;
    }

    /* --- Horizontal Menu 5 Buttons --- */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr); /* 5 ปุ่มเรียงแถวตรง */
      gap: 20px;
      margin-top: auto;
      margin-bottom: auto;
    }

    .menu-item {
      background: rgba(255, 255, 255, 0.8);
      border-radius: 30px;
      padding: 30px 15px;
      text-decoration: none;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 1px solid transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .menu-item:hover {
      transform: translateY(-15px);
      background: white;
      border-color: var(--accent-pink);
      box-shadow: 0 20px 40px rgba(255, 94, 153, 0.2);
    }

    .menu-item .icon {
      font-size: 50px;
      margin-bottom: 15px;
      filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
    }

    .menu-item span {
      font-weight: 500;
      color: #555;
      font-size: 1.1rem;
    }

    .menu-item small {
      font-size: 0.8rem;
      color: #999;
      margin-top: 5px;
      text-align: center;
    }

    /* --- Decorations --- */
    .floating-elements span {
      position: absolute;
      pointer-events: none;
      z-index: 1;
      animation: float 6s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0); }
      50% { transform: translateY(-30px) rotate(10deg); }
    }

    /* Responsive for smaller tablets */
    @media (max-width: 900px) {
      .menu-grid { grid-template-columns: repeat(3, 1fr); }
      .ipad-frame { height: auto; padding: 25px; }
      .main-title { font-size: 2.5rem; }
    }
  </style>
</head>
<body>

  <div class="floating-elements">
    <span style="top:10%; left:5%; font-size:40px;">🌸</span>
    <span style="top:20%; right:10%; font-size:30px; animation-delay: 1s;">✨</span>
    <span style="bottom:15%; left:10%; font-size:35px; animation-delay: 2s;">🎀</span>
    <span style="bottom:10%; right:5%; font-size:45px; animation-delay: 1.5s;">🧸</span>
  </div>

  <div class="ipad-frame">
    <div class="hero-section">
      <h1 class="main-title">Happy Together</h1>
      <p style="color:#888;">เวลาที่เราเดินไปด้วยกัน 💕</p>
      
      <div class="timer-board">
        <div class="time-card"><span class="val" id="y">0</span><span class="lbl">ปี</span></div>
        <div class="time-card"><span class="val" id="m">0</span><span class="lbl">เดือน</span></div>
        <div class="time-card"><span class="val" id="d">0</span><span class="lbl">วัน</span></div>
        <div class="time-card"><span class="val" id="h">0</span><span class="lbl">ชม.</span></div>
        <div class="time-card"><span class="val" id="min">0</span><span class="lbl">นาที</span></div>
      </div>
    </div>

    <div class="menu-grid">
      <div class="menu-item" onclick="location.href='memory.html'">
        <div class="icon">📸</div>
        <span>Match Game</span>
        <small>ทดสอบความจำรัก</small>
      </div>

      <div class="menu-item" onclick="location.href='jigsaw.html'">
        <div class="icon">🧩</div>
        <span>Jigsaw</span>
        <small>ต่อภาพของเรา</small>
      </div>

      <div class="menu-item" onclick="location.href='calendar.html'">
        <div class="icon">📅</div>
        <span>Calendar</span>
        <small>ความทรงจำ 12 เดือน</small>
      </div>

      <div class="menu-item" onclick="location.href='Fool.html'">
        <div class="icon">🥐</div>
        <span>Food</span>
        <small>บันทึกของอร่อยของเรา</small>
      </div>

       <div class="menu-item" onclick="location.href='WeNote.html'">
         <div class="icon">📝</div>
         <span>Secret Board</span>
          <small>โน้ตลับของเราสองคน</small>
      </div>
     </div>


    <div style="margin-top: auto; text-align: center; color: #ff9fb3; font-size: 0.9rem;">
       Since 2025.01.05 • Forever to go ∞
    </div>
  </div>

<script>
  // ตัวนับเวลา
  const start = new Date(2025, 0, 5, 0, 0, 0);
  
  function update() {
    const now = new Date();
    let years = now.getFullYear() - start.getFullYear();
    let months = now.getMonth() - start.getMonth();
    let days = now.getDate() - start.getDate();

    if (days < 0) {
      months--;
      days += new Date(now.getFullYear(), now.getMonth(), 0).getDate();
    }
    if (months < 0) {
      years--;
      months += 12;
    }

    const diff = now - start;
    const hours = Math.floor(diff / (1000*60*60)) % 24;
    const mins = Math.floor(diff / (1000*60)) % 60;

    document.getElementById('y').textContent = years;
    document.getElementById('m').textContent = months;
    document.getElementById('d').textContent = days;
    document.getElementById('h').textContent = hours;
    document.getElementById('min').textContent = mins;
  }

  setInterval(update, 1000);
  update();

  // สร้างหัวใจลอยแบบสุ่ม
  setInterval(() => {
    const heart = document.createElement("div");
    heart.innerHTML = "💗";
    heart.style.position = "fixed";
    heart.style.bottom = "-20px";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 20 + 10 + "px";
    heart.style.opacity = "0.7";
    heart.style.transition = "all 5s linear";
    heart.style.zIndex = "1";
    document.body.appendChild(heart);

    setTimeout(() => {
      heart.style.transform = `translateY(-110vh) translateX(${Math.random() * 100 - 50}px)`;
      heart.style.opacity = "0";
    }, 100);

    setTimeout(() => heart.remove(), 5000);
  }, 800);
</script>

</body>
</html>
